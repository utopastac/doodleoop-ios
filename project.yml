name: Doodleoop
options:
  bundleIdPrefix: com.archgrovehouse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
targets:
  Doodleoop:
    type: application
    platform: iOS
    sources:
      - path: Doodleoop
        excludes:
          - "Fraunces/**"
          - "Space_Mono/**"
          - "Permanent_Marker/**"
    info:
      path: Doodleoop/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces_72pt-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        NSPhotoLibraryAddUsageDescription: Doodleoop saves exported drawings to your photo library.
        NSLocalNetworkUsageDescription: Doodleoop uses the local network so nearby phones can play together.
        NSBonjourServices:
          - _doodleoop-game._tcp
          - _doodleoop-game._udp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.archgrovehouse.doodleoop
      PRODUCT_NAME: Doodleoop
      TARGETED_DEVICE_FAMILY: "1,2"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      DEVELOPMENT_TEAM: 2S5P26L7UP
      CODE_SIGN_STYLE: Automatic
  DoodleoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DoodleoopTests
    dependencies:
      - target: Doodleoop
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.archgrovehouse.doodleoop.tests
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: 2S5P26L7UP
      CODE_SIGN_STYLE: Automatic
  DoodleoopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DoodleoopUITests
    dependencies:
      - target: Doodleoop
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.archgrovehouse.doodleoop.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Doodleoop
      DEVELOPMENT_TEAM: 2S5P26L7UP
      CODE_SIGN_STYLE: Automatic
schemes:
  Doodleoop:
    build:
      targets:
        Doodleoop: all
        DoodleoopTests: [test]
        DoodleoopUITests: [test]
    test:
      targets:
        - DoodleoopTests
        - DoodleoopUITests
      gatherCoverageData: false
