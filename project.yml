name: Doodleoop
options:
  bundleIdPrefix: co.utopastac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
targets:
  Doodleoop:
    type: application
    platform: iOS
    sources:
      - path: Doodleoop
        excludes:
          - "Fraunces/**"
          - "Space_Mono/**"
          - "Permanent_Marker/**"
    info:
      path: Doodleoop/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Fraunces_72pt-Bold.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: co.utopastac.doodleoop
      PRODUCT_NAME: Doodleoop
      TARGETED_DEVICE_FAMILY: "1,2"
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
  DoodleoopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DoodleoopTests
    dependencies:
      - target: Doodleoop
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: co.utopastac.doodleoop.tests
      GENERATE_INFOPLIST_FILE: YES
